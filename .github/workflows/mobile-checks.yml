name: Mobile checks
on:
  pull_request:
  push:
    branches: [main, codex/mobile-account-integration]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx expo export --platform all
        env:
          CI: "1"
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-ui-checks
          path: test-results/
          retention-days: 7
